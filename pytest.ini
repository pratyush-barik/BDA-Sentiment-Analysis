[pytest]
minversion = 7.0

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

pythonpath = . src tests

addopts = 
    -v
    --tb=short
    -ra
    --strict-markers
    -p no:cacheprovider

markers =
    tier1: Tier 1 Feature Coverage (Schema validity, null coalescing, regex normalization, stopword filtering, sentiment labeling)
    tier2: Tier 2 Boundary Value Analysis & Invariants (MLlib pipelines, token dimensions, probability sums, confusion matrix conservation)
    tier3: Tier 3 Cross-Feature Integration (DataCleaner -> MapReduce, DocumentStore CRUD/Aggregations, Graph Analytics PageRank, Spark SQL)
    tier4: Tier 4 Real-World Application Scenarios (Full pipeline execution, visual plot exports, Web Dashboard API)
    spark: Tests requiring SparkSession or the dual-engine local Spark adapter
    database: Tests verifying MongoDocumentStore or LocalJsonDocumentStore operations
    graph: Tests verifying NetworkX bipartite graph and PageRank algorithms
    web: Tests verifying Flask dashboard routes and REST API endpoints
    slow: Tests requiring extended execution time (> 2 seconds)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:matplotlib.*
    ignore::UserWarning:seaborn.*
